[package]
name = "ttags"
version = "0.5.0"
authors = ["Nick Pezza <pezza@hey.com>"]
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
repository = "https://github.com/npezza93/ttags"
description = "Generate ctags using Tree Sitter"

[[bin]]
name = "ttags"
path = "src/main.rs"

[dependencies]
clap = "4.6.7"
tree-sitter = "0.27.1"
tree-sitter-d = "0.8.2"
npezza93_tree-sitter-tags = "0.23.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-haskell = "0.24.1"
tree-sitter-nix = "0.3.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
Inflector = "0.11.4"
pathdiff = "0.2.3"
sugar_path = "3.0.0"
walkdir = "2.5.0"
rayon = "1.12.0"
lsp-server = "0.10.0"
serde_json = "1.0.152"
lsp-types = "0.97.0"
tree-sitter-swift = "0.7.4"
regex = "1.13.1"
streaming-iterator = "0.1.9"

[build-dependencies]
clap = "4.6.7"
clap_complete = "4.6.11"
